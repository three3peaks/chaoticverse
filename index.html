<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CHAOTICVERSE</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/home.css">
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="preload" as="image" href="images/CHAOTICVERSE_1.webp">
</head>
<body>

<div class="fixed-overlay" id="overlay">
  <button class="minimize-button" id="minimize">–</button>
  <button class="lang-toggle-button" id="langToggle">EN</button>

  <div class="overlay-content-home-page">
    <div id="textHome"></div>
    <template id="main-poster-template">
      <img src="images/ChaoticverseLogo.png" alt="Chaoticverse Logo" class="logo-image">
    </template>
    <hr class="divider">

    <div class="button-row">
      <button class="nav-button">
        <a href="information" class="nav-button">
          <img src="images/buttons/information_button.png" alt="Information">
        </a>
      </button>
      <button class="nav-button">
        <a href="contents" class="nav-button">
          <img src="images/buttons/contents_button.png" alt="Contents">
        </a>
      </button>
      <button class="nav-button">
        <a href="characters" class="nav-button">
          <img src="images/buttons/characters_button.png" alt="Characters">
        </a>
      </button>
      <button class="nav-button">
        <a href="progress" class="nav-button">
          <img src="images/buttons/progress_button.png" alt="Progress">
        </a>
      </button>
      <button class="nav-button">
        <a href="artworks" class="nav-button">
          <img src="images/buttons/artworks_button.png" alt="Artworks">
        </a>
      </button>
      <button class="nav-button">
        <a href="about_us" class="nav-button">
          <img src="images/buttons/about_us_button.png" alt="About Us">
        </a>
      </button>
      <button class="nav-button">
        <a href="https://boosty.to/sput27" target="_blank" class="nav-button">
          <img src="images/buttons/support_us_button.png" alt="Support Us">
        </a>
      </button>
    </div>

    <hr class="divider">

    <div class="button-row center-row">
      <picture class="gif-picture">
        <img src="images/buttons/technical_improvements.gif" alt="Tech_Works">
      </picture>
    </div>

    <hr class="divider">

    <div class="button-row">
      <a href="https://vk.com/sole_production_ut" target="_blank" class="nav-app-icon">
        <img src="images/buttons/vk_button.png" alt="VK">
      </a>
      <a href="https://official-chaoticverse.tumblr.com" target="_blank" class="nav-app-icon">
        <img src="images/buttons/tumblr_button.png" alt="Tumblr">
      </a>
      <a href="https://t.me/sput_channel" target="_blank" class="nav-app-icon">
        <img src="images/buttons/telegram_button.png" alt="Telegram">
      </a>
    </div>

    <div class="overlay-footer-text">
      © <span id="year"></span> SOLE PRODUCTION UT PROJECT
    </div>
  </div>
</div>

<div class="restore-button" id="restore">+</div>
<div id="backgroundHeight"></div>
<script src="background-resize.js" data-bg="images/CHAOTICVERSE_1.webp"></script>
    <script src="lang-preference.js"></script>
    <script src="scripts.js"></script>
</body>
</html>
